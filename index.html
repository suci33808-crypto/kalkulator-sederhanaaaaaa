<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Sederhana</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#1e1e2f;
    }

    .calculator{
      background:#2c2c3e;
      padding:20px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.3);
      width:320px;
    }

    .display{
      width:100%;
      height:60px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      padding:10px;
      font-size:28px;
      text-align:right;
      background:#fff;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    button{
      height:60px;
      border:none;
      border-radius:10px;
      font-size:22px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.8;
    }

    .number{
      background:#e7e4eb;
    }

    .operator{
      background:#c765b2;
      color:white;
    }

    .equal{
      background:#c071b3;
      color:white;
    }

    .clear{
      background:#16718d;
      color:white;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>
      <button class="number" onclick="appendValue('.')">.</button>

      <button class="number" style="grid-column: span 4;" onclick="appendValue('0')">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function appendValue(value) {
      // Kalau awal 0, ganti langsung
      if (display.value === "0") {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = "0";
    }

    function calculate() {
      try {
        let result = eval(display.value);

        // Membuat hasil desimal lebih akurat
        result = parseFloat(result.toFixed(10));

        display.value = result;
      } catch {
        display.value = "Error";
      }
    }
  </script>

</body>
</html>
